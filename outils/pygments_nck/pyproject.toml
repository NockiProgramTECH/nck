[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pygments-nck"
version = "0.1.0"
description = "Coloration syntaxique Pygments pour le langage NCK"
dependencies = ["pygments"]

[project.entry-points."pygments.lexers"]
nck = "pygments_nck:NckLexer"
